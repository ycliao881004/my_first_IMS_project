name: Build and Deploy to GKE

on:
  push:
    branches:
      - main # 當推送到 main 分支時自動觸發
  workflow_dispatch:

env:
  PROJECT_ID: ims-k8s-proj-2026
  GAR_LOCATION: asia-east1
  GKE_CLUSTER: inventory-cluster
  GKE_ZONE: asia-east1
  REPOSITORY: inventory-repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # 1. 登入 GCP
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2. 設定 Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      # 3. 登入 Artifact Registry (Docker)
      - name: Configure Docker for GCP
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # 4-1. 設定 Java 環境並編譯後端 Spring Boot
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot Backend with Maven
        run: |
          cd inventoryMgtSystem
          mvn clean package -DskipTests

      # 4-2. 打包並推送後端映像檔
      - name: Build & Push Backend
        run: |
          docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/inventory-backend:${{ github.sha }} ./inventoryMgtSystem
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/inventory-backend:${{ github.sha }}

      # 4-3. 打包並推送前端映像檔
      - name: Build & Push Frontend
        run: |
          docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/inventory-frontend:${{ github.sha }} ./ims-react
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/inventory-frontend:${{ github.sha }}

      # 5. 連線至 GKE
      - name: Connect to GKE
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      # 6. 自動更新 GKE 上的後端與前端映像檔
      - name: Deploy to GKE
        run: |
          # 更新後端
          kubectl set image deployment/backend backend=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/inventory-backend:${{ github.sha }}
          # 更新前端
          kubectl set image deployment/frontend frontend=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/inventory-frontend:${{ github.sha }}
          
          # 等待滾動更新完成
          kubectl rollout status deployment/backend
          kubectl rollout status deployment/frontend

      # 7. 穩定還原資料庫備份（避免管線編碼截斷問題）
      - name: Restore MySQL Backup
        run: |
          echo "等待 MySQL Pod 準備就緒..."
          kubectl wait --for=condition=ready pod -l app=mysql --timeout=90s
          
          MYSQL_POD=$(kubectl get pod -l app=mysql -o jsonpath="{.items[0].metadata.name}")
          
          # 確保目標庫存在
          kubectl exec $MYSQL_POD -- mysql -u root -prootpassword -e "CREATE DATABASE IF NOT EXISTS inventory_db;"
          
          # 複製檔案進 Pod 內部再以 native source 匯入
          kubectl cp backup.sql $MYSQL_POD:/tmp/backup.sql
          kubectl exec $MYSQL_POD -- mysql -u root -prootpassword --default-character-set=utf8mb4 inventory_db -e "source /tmp/backup.sql;"
          
          # 查看最新產生的公開 IP
          kubectl get services